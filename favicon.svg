<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600');
    </style>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#09090b" />
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="98" height="98" rx="19" fill="none" stroke="rgba(250,204,21,0.2)"
    stroke-width="1.5" />

  <!-- CS monogram -->
  <text
    x="50"
    y="68"
    font-family="'Playfair Display', Georgia, serif"
    font-size="52"
    font-weight="600"
    fill="#facc15"
    text-anchor="middle"
    letter-spacing="-1"
  >CS</text>
</svg>